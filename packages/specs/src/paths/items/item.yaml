get:
  summary: Retrieve an Item
  description: Retrieve a single item by unique identifier.
  tags:
    - Items
  operationId: getItem
  parameters:
    - $ref: '../../openapi.yaml#/components/parameters/Fields'
    - $ref: '../../openapi.yaml#/components/parameters/Meta'
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'

patch:
  summary: Update an Item
  description: >-
    Update an existing item. To detect changes someone else saved in the meantime, add `$base` to the body (also in
    nested items): the SHA-256 hashes of the values the changes are based on, by field. Nested `delete` alterations can
    contain `$deleteBase` with the hashes by primary key. If any of the values changed, nothing is saved and the API
    responds with 409 CONFLICT.
  tags:
    - Items
  operationId: updateItem
  parameters:
    - $ref: '../../openapi.yaml#/components/parameters/Fields'
    - $ref: '../../openapi.yaml#/components/parameters/Meta'
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            $base:
              type: object
              description: Hashes of the values the changes are based on, by field. A hash of `null` skips the check.
              additionalProperties:
                type: string
                nullable: true
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'
    '409':
      $ref: '../../openapi.yaml#/components/responses/ConflictError'

delete:
  summary: Delete an Item
  description: Delete an existing item.
  tags:
    - Items
  operationId: deleteItem
  responses:
    '204':
      description: Successful request
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'
parameters:
  - $ref: '../../openapi.yaml#/components/parameters/Collection'
  - name: id
    description: Index of the item.
    in: path
    required: true
    schema:
      oneOf:
        - type: integer
          description: Incremental index of the item.
          example: 1
        - type: string
          description: Unique identifier of the item.
          example: 8cbb43fe-4cdf-4991-8352-c461779cec02
